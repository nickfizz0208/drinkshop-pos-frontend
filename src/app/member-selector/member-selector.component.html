<app-modal title="選擇外送會員" subtitle="PHONE DELIVERY" (dismissed)="dismissed.emit()">
  <div class="modal-body">
    <label class="field">會員電話
      <input type="tel" inputmode="numeric" autocomplete="off" maxlength="10" autofocus placeholder="輸入電話（只輸入數字），至少 3 碼"
        [value]="phone" (input)="onPhoneInput($any($event.target))" (keydown.enter)="pickOnlyResult()">
    </label>
    @if (error) { <p class="alert error" role="alert">{{ error }}</p> }
    <div class="member-results" aria-live="polite">
      @if (phone.length < minDigits) { <p class="muted small-copy">輸入至少 {{ minDigits }} 碼電話後，會顯示符合的會員。</p>
        } @else if (loading) {
        <p class="muted small-copy">搜尋中…</p>
        } @else if (searched && !results.length && !error) {
        <p class="muted small-copy">查無電話含「{{ phone }}」的會員。</p>
        } @else if (results.length) {
        <ul class="member-list" aria-label="符合的會員">
          @for (member of results; track member.phone) {
          <li>
            <button type="button" class="member-row" (click)="selected.emit(member)">
              <span class="member-main"><strong>{{ member.name }}</strong><span>{{ member.phone }}</span></span>
              <small>{{ member.address || '未建檔地址' }}</small>
            </button>
          </li>
          }
        </ul>
        }
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="button secondary" (click)="dismissed.emit()">取消</button>
  </div>
</app-modal>
